; Supervisor configuration for Laravel Reverb WebSocket server
; Place this file in /etc/supervisor/conf.d/ on Linux VPS
;
; Installation:
;   sudo apt install supervisor
;   sudo cp laravel-reverb.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-reverb:*

[program:laravel-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php {{ARTISAN_PATH}} reverb:start --debug
directory={{LARAVEL_BASE_PATH}}
autostart=true
autorestart=true
startretries=3
stopwaitsecs=600
user={{SERVER_USER}}
numprocs=1
redirect_stderr=true
stdout_logfile={{LOG_DIR}}/reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=
    REVERB_ALLOW_INSECURE="true",
